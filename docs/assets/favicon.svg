<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#6d4aff"/>
  <!-- perched sparrow, facing right -->
  <g fill="#ffffff">
    <!-- tail -->
    <path d="M9.5 20.5 L3.5 25.5 L11 23.2 Z" opacity=".65"/>
    <!-- body + head + beak -->
    <path d="M7.2 22.2
             C 8.4 17.5, 9.2 14.2, 12 11.6
             C 14.4 9.3, 18 8.6, 20.6 9.2
             L 25.5 8.2 L 21.6 11.2
             C 22.4 13.8, 21.8 17.2, 19.4 19.4
             C 16.4 22.1, 11 22.9, 7.2 22.2 Z"/>
  </g>
  <!-- wing -->
  <path d="M12.6 15.2 C 15 13.6, 17.8 13.9, 19.6 15.4 C 17.2 17.1, 14.4 17.2, 12.6 15.2 Z" fill="#6d4aff" opacity=".55"/>
  <!-- eye -->
  <circle cx="18.7" cy="12.2" r="1.05" fill="#6d4aff"/>
</svg>
