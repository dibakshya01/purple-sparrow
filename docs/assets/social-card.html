<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    body {
      background: #0c0a09; color: #f4ede7; overflow: hidden; position: relative;
      font-family: "Space Grotesk", sans-serif;
      display: flex; flex-direction: column; justify-content: center;
      padding: 72px 80px;
    }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(#2a211b 1px, transparent 1px), linear-gradient(90deg, #2a211b 1px, transparent 1px); background-size: 54px 54px; opacity: .4; -webkit-mask-image: radial-gradient(ellipse 70% 80% at 80% 10%, #000 20%, transparent 70%); }
    .glow { position: absolute; top: -200px; right: -120px; width: 720px; height: 620px; background: radial-gradient(circle, rgba(255,120,40,.5), transparent 62%); filter: blur(30px); }
    .row { display: flex; align-items: center; gap: 20px; position: relative; }
    .mark { width: 76px; height: 76px; }
    .name { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
    .name span { color: #fb923c; }
    h1 { position: relative; font-size: 76px; line-height: 1.02; letter-spacing: -0.03em; margin: 34px 0 20px; max-width: 16ch;
         background: linear-gradient(180deg,#fff,#ffd8bf); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lede { position: relative; font-size: 27px; color: #c9bcb2; max-width: 40ch; line-height: 1.4; }
    .chips { position: relative; display: flex; gap: 14px; margin-top: 34px; font-family: "JetBrains Mono", monospace; }
    .chip { font-size: 18px; color: #f0d9c8; border: 1px solid #40342b; background: rgba(255,120,40,.08); padding: 9px 16px; border-radius: 100px; }
    .cmd { position: absolute; bottom: 56px; left: 80px; font-family: "JetBrains Mono", monospace; font-size: 20px; color: #f4ede7; }
    .cmd .p { color: #fb923c; }
  </style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="row">
    <svg class="mark" viewBox="0 0 32 32" style="color:#fb923c"><path d="M8 21 L2.3 27.4 L10.6 24 Z" fill="currentColor" opacity=".6"/><path d="M5 23 C 6.4 17, 8 13.4, 12 10.9 C 15 9, 19.2 9, 22.2 10.1 L 28 9.3 L 22.6 12.3 C 23.6 15.2, 23 18.6, 20 20.6 C 16.4 23, 9.4 23.9, 5 23 Z" fill="currentColor"/><path d="M11.4 15.6 C 14.4 13.6, 18.6 14.1, 21.2 16.1 C 18.1 18.4, 14 18.5, 11.4 15.6 Z" fill="#0c0a09"/><circle cx="20" cy="12" r="1.15" fill="#0c0a09"/></svg>
    <div class="name"><span>Orange</span> Crow</div>
  </div>
  <h1>The agent-native backend.</h1>
  <div class="lede">Deny-by-default policies, self-correcting errors, and native MCP — in a single Go binary.</div>
  <div class="chips"><span class="chip">Apache-2.0</span><span class="chip">single binary</span><span class="chip">MCP-native</span><span class="chip">deny-by-default</span></div>
  <div class="cmd"><span class="p">$</span> go build ./cmd/orangecrow &amp;&amp; ./orangecrow</div>
</body>
</html>
