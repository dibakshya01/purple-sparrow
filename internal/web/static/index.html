<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purple Sparrow</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: #0b0b12; color: #e8e6f0;
      }
      .card { text-align: center; padding: 2rem; }
      h1 { margin: 0 0 .25rem; font-size: 1.6rem; letter-spacing: -0.01em; }
      .dot { color: #a78bfa; }
      p { margin: .25rem 0; opacity: .8; }
      code { background: #1a1a2e; padding: .15rem .4rem; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Purple Sparrow <span class="dot">●</span></h1>
      <p>Agent-native backend is running.</p>
      <p>Dashboard coming in a later milestone. Try <code>GET /v1</code> or <code>GET /healthz</code>.</p>
    </div>
  </body>
</html>
